<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Colección exclusiva de cartas Pokémon Neo-Collector con ilustraciones oficiales en alta resolución y sistema de likes persistente.">
  <title>PokéDeck Neo-Collector | Cartas Pokémon y Favoritos</title>
  
  <!-- Tipografía Display Optimizada -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Hoja de estilos del sistema de diseño -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Enlace de salto accesible para navegación por teclado -->
  <a href="#cards-container" class="skip-link">Saltar a la colección de cartas</a>

  <!-- Cabecera principal con branding e indicador de likes en vivo -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-identity">
        <svg class="brand-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true" focusable="false">
          <circle cx="16" cy="16" r="14" stroke="#F43F5E" stroke-width="2.5" />
          <path d="M2 16H30" stroke="#F43F5E" stroke-width="2.5" />
          <circle cx="16" cy="16" r="5" fill="#111827" stroke="#F43F5E" stroke-width="2.5" />
          <circle cx="16" cy="16" r="2" fill="#F43F5E" />
          <path d="M3.5 13.5A13.9 13.9 0 0 1 16 2.5a13.9 13.9 0 0 1 12.5 11" fill="rgba(244, 63, 94, 0.15)" />
        </svg>
        <div class="brand-text-group">
          <h1 class="brand-title">PokéDeck</h1>
          <span class="brand-badge">Neo-Collector</span>
        </div>
      </div>

      <!-- Contador global de favoritos con región accesible en vivo -->
      <div class="likes-counter-widget" role="status" aria-live="polite">
        <svg class="counter-heart-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        </svg>
        <span class="likes-label">Favoritos:</span>
        <span id="total-likes-count" class="likes-badge">0</span>
      </div>
    </div>
  </header>

  <!-- Contenedor principal del catálogo -->
  <main id="main-content" class="app-main">
    <div class="main-inner">
      <header class="collection-intro">
        <h2 class="section-title">Primera Generación</h2>
        <p class="section-subtitle">24 cartas seleccionadas en alta definición oficial. Colecciona tus Pokémon favoritos.</p>
      </header>

      <!-- Cuadrícula de cartas con región accesible (los skeletons y cartas se inyectan vía JS) -->
      <section id="cards-container" class="cards-grid" role="region" aria-label="Colección de cartas Pokémon" aria-busy="true">
        <!-- Renderizado dinámico de 24 skeletons / cartas mediante js/ui.js -->
      </section>
    </div>
  </main>

  <!-- Región viva silenciosa para anuncios accesibles a lectores de pantalla -->
  <div id="live-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <!-- Pie de página informativo -->
  <footer class="app-footer">
    <div class="footer-inner">
      <p class="footer-copy">PokéDeck Neo-Collector &bull; Datos e ilustraciones oficiales cortesía de PokéAPI &bull; Sin dependencias externas</p>
    </div>
  </footer>

  <!-- Carga modular nativa ES Modules -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
